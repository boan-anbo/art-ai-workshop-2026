<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search the Met</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #202124; background: #fff; }
  header { text-align: center; padding: 48px 16px 24px; }
  h1 { font-weight: 400; font-size: 40px; margin: 0 0 24px; letter-spacing: -.5px; }
  h1 span { color: #e31f27; }
  form { display: flex; justify-content: center; gap: 8px; }
  input { width: min(560px, 80vw); font-size: 18px; padding: 12px 20px; border: 1px solid #dfe1e5; border-radius: 24px; outline: none; }
  input:focus { box-shadow: 0 1px 6px rgba(32,33,36,.28); }
  button { font-size: 15px; padding: 0 20px; border: 1px solid #f8f9fa; background: #f8f9fa; border-radius: 6px; cursor: pointer; }
  #status { text-align: center; color: #5f6368; font-size: 14px; margin: 8px 0 20px; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
  .card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
  .card img, .card .noimg { width: 100%; height: 170px; object-fit: cover; background: #f1f3f4; display: block; }
  .card .noimg { display: flex; align-items: center; justify-content: center; color: #9aa0a6; font-size: 13px; }
  .meta { padding: 10px 12px 12px; font-size: 14px; line-height: 1.35; }
  .meta a { color: #1a0dab; text-decoration: none; font-size: 15px; }
  .meta .who { color: #4d5156; }
  .pd { display: inline-block; margin-top: 6px; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e6f4ea; color: #137333; }
</style>
</head>
<body>
<header>
  <h1>Search <span>the Met</span></h1>
  <form id="f"><input id="q" value="Lingnan" autocomplete="off"><button>Search</button></form>
</header>
<div id="status"></div>
<div id="results"></div>
<script>
// The Met Collection API: search (v1.1, paginated), then one call per object.
const API = "https://collectionapi.metmuseum.org/public/collection";
async function search(q) {
  status.textContent = "Searching…"; results.innerHTML = "";
  const s = await (await fetch(`${API}/v1.1/search?q=${encodeURIComponent(q)}&limit=12`)).json();
  status.textContent = `${s.total} results for “${q}”`;
  const objs = await Promise.all((s.objectIDs || []).map(id => fetch(`${API}/v1/objects/${id}`).then(r => r.json())));
  for (const o of objs) {
    const img = o.primaryImageSmall ? `<img src="${o.primaryImageSmall}" alt="">` : `<div class="noimg">no image</div>`;
    results.insertAdjacentHTML("beforeend", `<div class="card">${img}<div class="meta">
      <a href="${o.objectURL}" target="_blank">${o.title}</a><br>
      <span class="who">${o.artistDisplayName || "Unknown"} · ${o.objectDate || ""}</span><br>
      ${o.isPublicDomain ? '<span class="pd">public domain</span>' : ""}</div></div>`);
  }
}
const status = document.getElementById("status"), results = document.getElementById("results");
document.getElementById("f").onsubmit = e => { e.preventDefault(); search(document.getElementById("q").value); };
search("Lingnan");
</script>
</body>
</html>
